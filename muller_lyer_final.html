<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミュラー・リヤー錯視調整法実験</title>
 
  <!-- jsPsych core and CSS -->
  <script src="https://unpkg.com/jspsych@7.3.1"></script>
  <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
 
  <!-- jsPsych plugin CDN links -->
  <script src="https://unpkg.com/@jspsych/plugin-canvas-slider-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>

  <style>
    /* 全体レイアウトを上下左右中央に配置（画面内に完璧に収める） */
    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      background-color: #f3f4f6; /* よりモダンで目に優しい淡いグレー */
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* 実験中はスクロールバーを非表示にし画面内に収める */
      -webkit-tap-highlight-color: transparent; /* モバイルのタップハイライトを防止 */
    }

    #jspsych-target {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jspsych-content-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .jspsych-content {
      max-width: 700px; /* 横幅を少し広げてゆとりを持たせる */
      width: 92%;
      max-height: 96vh;
      padding: 32px 24px; /* 余白を広げてプレミアムな雰囲気に */
      background: #ffffff;
      border-radius: 16px; /* 角丸を少し滑らかに */
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* 教示・終了画面のテキストスタイル */
    .instruction-text, .end-text {
      text-align: left;
      line-height: 1.8; /* 行間を広げて圧倒的に読みやすく */
      color: #374151; /* 少しだけ柔らかい黒 */
      margin-bottom: 24px;
      font-size: 1.15rem; /* 小学生でも読みやすい大きめのサイズ */
    }

    .instruction-text ul {
      padding-left: 20px;
      margin: 12px 0;
    }

    .instruction-text li {
      margin-bottom: 8px;
    }

    .instruction-title {
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 24px;
      color: #111827;
      letter-spacing: -0.025em;
    }

    /* 実験画面プロンプト（試行数表示）のスタイル */
    .trial-counter {
      font-size: 1.1rem;
      font-weight: 600;
      color: #6b7280; /* 目立たない上品なグレー */
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    /* 参加者ID入力欄（Survey-text）のスタイリング */
    .jspsych-survey-text-question {
      margin: 24px 0 !important;
      text-align: left;
      width: 100%;
    }
    .jspsych-survey-text-question label {
      font-size: 1.15rem;
      font-weight: 600;
      color: #374151;
    }
    .jspsych-survey-text-question input {
      width: 100% !important;
      padding: 14px 16px !important;
      border: 2px solid #e5e7eb !important;
      border-radius: 10px !important;
      font-size: 1.1rem !important;
      margin-top: 12px !important;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .jspsych-survey-text-question input:focus {
      border-color: #4f46e5 !important;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
    }

    /* --- jsPsych標準スライダーレイアウトの競合回避と最適化 --- */
    
    /* 大元のラッパーのマージンをリセット */
    #jspsych-canvas-slider-response-wrapper {
      margin: 10px 0 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* キャンバス外観調整 */
    canvas {
      border: 2px solid #e5e7eb;
      background-color: #ffffff;
      border-radius: 12px;
      display: block;
      margin: 0 auto 16px auto;
      max-width: 100%;
      height: auto;
      flex-shrink: 0;
    }

    /* スライダーを格納するコンテナ */
    .jspsych-canvas-slider-response-container {
      width: 90% !important;
      max-width: 440px !important; /* スマホやPCで操作しやすい理想の幅 */
      margin: 12px auto 20px auto !important;
    }

    /* スライダー（input[type="range"]）本体 */
    input[type="range"].jspsych-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100% !important;
      height: 10px !important; /* バーを少し細くしてクローバーを目立たせる */
      background: #e5e7eb;
      border-radius: 9999px;
      outline: none;
      margin: 16px 0 !important;
    }

    /* Webkit (Chrome, Safari, Edge, iOS) 用のつまみスタイル（クローバー） */
    input[type="range"].jspsych-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 44px !important; /* モバイル対応：つまみサイズをタップしやすい大きさに調整 */
      height: 44px !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text x="50%" y="60%" dominant-baseline="central" text-anchor="middle" font-size="20">🍀</text></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      border: none !important;
      background-color: transparent !important;
      transition: transform 0.1s;
    }

    input[type="range"].jspsych-slider::-webkit-slider-thumb:active {
      transform: scale(1.15); /* 動かしている間は少し大きくなる演出 */
    }

    /* Firefox 用のつまみスタイル（クローバー） */
    input[type="range"].jspsych-slider::-moz-range-thumb {
      width: 44px !important;
      height: 44px !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text x="50%" y="60%" dominant-baseline="central" text-anchor="middle" font-size="20">🍀</text></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      border: none !important;
      background-color: transparent !important;
      transition: transform 0.1s;
    }

    input[type="range"].jspsych-slider::-moz-range-thumb:active {
      transform: scale(1.15);
    }

    /* 決定ボタン */
    #jspsych-canvas-slider-response-btn {
      padding: 14px 36px !important; /* スマホでも確実にタップできるサイズ感 */
      background-color: #4f46e5 !important;
      color: white !important;
      border: none !important;
      border-radius: 10px !important;
      font-size: 1.1rem !important;
      font-weight: bold !important;
      cursor: pointer !important;
      transition: background-color 0.2s, transform 0.1s !important;
      margin-top: 12px !important;
      flex-shrink: 0;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    
    #jspsych-canvas-slider-response-btn:hover {
      background-color: #4338ca !important;
    }

    #jspsych-canvas-slider-response-btn:active {
      transform: scale(0.98);
    }

    /* 教示・終了ボタン */
    .jspsych-btn {
      padding: 14px 36px !important;
      background-color: #4f46e5 !important;
      color: white !important;
      border: none !important;
      border-radius: 10px !important;
      font-size: 1.1rem !important;
      font-weight: bold !important;
      cursor: pointer !important;
      transition: background-color 0.2s, transform 0.1s !important;
      flex-shrink: 0;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .jspsych-btn:hover {
      background-color: #4338ca !important;
    }

    .jspsych-btn:active {
      transform: scale(0.98);
    }

    /* ローディングアニメーション */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>

  <script>
    // jsPsychの初期化
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: function() {
        // 1. 画面のスクロールロックを解除
        document.body.style.overflow = 'auto';
        document.documentElement.style.overflow = 'auto';

        // 2. 実験で得られた調整値のデータ（canvas-slider-response）のみを抽出
        const relevantData = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'});
        const csvData = relevantData.csv();

        // 指定のデータ構造にフィルタリング
        const trialsForGas = relevantData.values().map(trial => {
          return {
            subject_id: trial.subject_id,
            timestamp: trial.timestamp,
            angle: trial.angle,
            wing_length: trial.wing_length,
            pse: trial.pse,
            error_amount: trial.error_amount
          };
        });

        // 3. GAS送信中の画面を表示
        const target = document.getElementById('jspsych-target');
        target.innerHTML = `
          <div class="jspsych-content">
            <div class="instruction-title">データを送っています</div>
            <p class="end-text" style="text-align: center;">データをサーバーに送っています。すこしだけお待ちください...</p>
            <div class="spinner"></div>
          </div>
        `;

        // 4. GASへデータを送信
        const gasUrl = 'https://script.google.com/macros/s/AKfycbxCr6lLRjAuEQMChu-Gw6swxPn61bFd4bagE_8YuuZZXV5rHYkRft2PEYKOkhLP1C15sA/exec';
        
        fetch(gasUrl, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'text/plain' // CORSプリフライトを回避し確実にGASで受信するため
          },
          body: JSON.stringify(trialsForGas)
        })
        .then(response => {
          // 安全にフォールバック
          showFinalResults(trialsForGas, csvData, "自動データ保存に成功しました！", null);
        })
        .catch(error => {
          showFinalResults(
            trialsForGas,
            csvData,
            "自動データ送信の確認が取れませんでした",
            "ネットワーク環境、またはCORS制限の可能性があります。データはGASへ送信された可能性がありますが、安全のためCSVデータを手動で控えてください。(" + error.message + ")"
          );
        });
      }
    });

    // 独立変数: 角度（15度, 75度）× 羽の長さ（20px, 50px）
    const factors = {
      angle: [15, 75],
      feather_length: [20, 50]
    };

    // フルファクトリアルデザインを作成（4条件）
    const base_design = jsPsych.randomization.factorial(factors, 1);
    
    // 各条件を3回ずつ繰り返して計12試行にする
    let trials_config = [];
    for (let i = 0; i < 3; i++) {
      trials_config = trials_config.concat(JSON.parse(JSON.stringify(base_design)));
    }
    
    // 12試行をランダムにシャッフル
    trials_config = jsPsych.randomization.shuffle(trials_config);
    const total_trials = trials_config.length;

    // タイムラインの作成
    const timeline = [];

    // 1. 参加者情報の追加
    const participant_info = {
      type: jsPsychSurveyText,
      questions: [
        {
          prompt: 'あなたの名前や、出席番号（ID）を入力してください：',
          placeholder: '例：A-01',
          required: true,
          name: 'subject_id'
        }
      ],
      button_label: '次へ進む',
      on_finish: function(data) {
        // 入力されたIDをグローバルな全試行データにプロパティとして追加
        jsPsych.data.addProperties({
          subject_id: data.response.subject_id
        });
      }
    };
    timeline.push(participant_info);

    // 2. 教示画面の作成 (小学生でも読める優しい言葉遣いへ)
    const instructions = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="instruction-title">目の錯覚（さっかく）テスト</div>
        <div class="instruction-text">
          <p>ご協力ありがとうございます。これから短い視覚のテストを行います。</p>
          <p>画面には、２つの「矢印（やじるし）のような図形」が上下に並んで表示されます。</p>
          <ul>
            <li><strong>上の図形</strong>: 長さはいつも同じです。</li>
            <li><strong>下の図形</strong>: 画面の下にあるスライダーを動かすと、長さが伸びたり縮んだりします。</li>
          </ul>
          <p><strong>【やるべきこと】</strong><br>
          下のスライダーを左右に動かして、<strong>「上の横線」と「下の横線」がピッタリ同じ長さ</strong>に見えるところで調整してください。</p>
          <p>「ちょうど同じ長さになった！」と思ったら、スライダーの下にある<strong>【決定】</strong>ボタンを押してください。</p>
          <p>テストは全部で <strong>12回</strong> あります。</p>
        </div>
      `,
      choices: ['テストを始める'],
      post_trial_gap: 1000
    };
    timeline.push(instructions);

    // 試行中で現在アクティブなキャンバス要素を確実に保持するスコープ変数
    let activeCanvas = null;

    // 3. 錯視調整試行のループ作成
    trials_config.forEach((config, index) => {
      
      // 試行ごとの初期値（100px 〜 300px）をランダムに設定
      const start_val = Math.floor(Math.random() * (300 - 100 + 1)) + 100;

      // 1試行分のスライダー調整プラグイン設定
      const trial = {
        type: jsPsychCanvasSliderResponse,
        stimulus: function(c, slider_value) {
          // 現在の有効なキャンバス参照を確実に保存する
          activeCanvas = c;

          // 初期描画時、slider_valueがundefinedやnull、NaNとなる場合を想定して安全に処理
          let current_val = start_val;
          if (slider_value !== undefined && slider_value !== null) {
            const parsed = parseFloat(slider_value);
            if (!isNaN(parsed)) {
              current_val = parsed;
            }
          }
          drawMullerLyer(c, current_val, config.angle, config.feather_length);
        },
        slider_start: start_val,
        min: 50,
        max: 350,
        step: 1,
        labels: ['50', '350'],
        button_label: '決定',
        canvas_size: [300, 500], // [height, width]
        prompt: function() {
          return `<div class="trial-counter">現在 ${index + 1} 回目 / 全部で ${total_trials} 回</div>`;
        },
        // スライダーのDOM要素がマウントされた瞬間に確実にイベントを結びつける
        on_load: function() {
          const slider = document.querySelector('input[type="range"]');
          
          if (slider) {
            // スライダーをドラッグ、もしくは変更した瞬間に、現在のキャンバスにダイレクトに再描画する
            const updateDrawing = function() {
              if (activeCanvas) {
                const current_val = parseFloat(slider.value);
                drawMullerLyer(activeCanvas, current_val, config.angle, config.feather_length);
              }
            };

            // ドラッグ中(input)とクリック移動(change)の両方をカバー
            slider.addEventListener('input', updateDrawing);
            slider.addEventListener('change', updateDrawing);

            // ロード時の初期描画を一度強制的に実行
            updateDrawing();
          }
        },
        data: {
          trial_index_custom: index + 1,
          standard_length: 200,          // 標準刺激の長さ（固定）
          feather_angle: config.angle,   // 羽の角度
          feather_length: config.feather_length, // 羽の長さ
          angle: config.angle,           // ご指定データ構造用
          wing_length: config.feather_length, // ご指定データ構造用
          initial_value: start_val       // ランダムな初期値
        },
        on_finish: function(data) {
          // 参加者が最終的に選択した長さを保存
          data.adjusted_length = parseFloat(data.response);
          data.pse = data.adjusted_length; // ご指定データ構造用
          // 錯視量（調整値 - 標準刺激200px）を計算して保存
          data.pse_error = data.adjusted_length - data.standard_length;
          data.error_amount = data.pse_error; // ご指定データ構造用
          data.timestamp = new Date().toISOString(); // ご指定データ構造用
          
          // キャンバスの参照をクリア
          activeCanvas = null;
        }
      };
      
      timeline.push(trial);
    });

    // 4. 実験用描画関数 (一切の変更や簡略化を行わずに保持)
    function drawMullerLyer(canvas, adjusted_length, angleDeg, featherLen) {
      const ctx = canvas.getContext('2d');
      
      // 画面クリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const width = canvas.width;
      const height = canvas.height;
      
      // 共通設定
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1e293b'; // ダークネイビー
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const angleRad = (angleDeg * Math.PI) / 180;
      
      // ---------------------------------------------
      // 1. 上半分：標準刺激 (内向き羽 / 200px固定)
      // ---------------------------------------------
      const topY = height * 0.3; // 上から30%の位置
      const stdLength = 200;
      const stdStartX = (width - stdLength) / 2;
      const stdEndX = stdStartX + stdLength;
      
      // 水平線の描画
      ctx.beginPath();
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdEndX, topY);
      ctx.stroke();
      
      // 内向き羽（矢羽が内側に閉じる形状）
      // 左端の羽 (右方向に向かう)
      ctx.beginPath();
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdStartX + featherLen * Math.cos(angleRad), topY - featherLen * Math.sin(angleRad));
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdStartX + featherLen * Math.cos(angleRad), topY + featherLen * Math.sin(angleRad));
      
      // 右端の羽 (左方向に向かう)
      ctx.moveTo(stdEndX, topY);
      ctx.lineTo(stdEndX - featherLen * Math.cos(angleRad), topY - featherLen * Math.sin(angleRad));
      ctx.moveTo(stdEndX, topY);
      ctx.lineTo(stdEndX - featherLen * Math.cos(angleRad), topY + featherLen * Math.sin(angleRad));
      ctx.stroke();
      
      // ---------------------------------------------
      // 2. 下半分：比較刺激 (外向き羽 / スライダー可変)
      // ---------------------------------------------
      const bottomY = height * 0.7; // 上から70%の位置
      const compLength = parseFloat(adjusted_length); // 数値に安全にキャスト
      const compStartX = (width - compLength) / 2;
      const compEndX = compStartX + compLength;
      
      // 水平線の描画
      ctx.beginPath();
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compEndX, bottomY);
      ctx.stroke();
      
      // 外向き羽（矢羽が外側に広がる形状）
      // 左端の羽 (左方向に向かう)
      ctx.beginPath();
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compStartX - featherLen * Math.cos(angleRad), bottomY - featherLen * Math.sin(angleRad));
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compStartX - featherLen * Math.cos(angleRad), bottomY + featherLen * Math.sin(angleRad));
      
      // 右端の羽 (右方向に向かう)
      ctx.moveTo(compEndX, bottomY);
      ctx.lineTo(compEndX + featherLen * Math.cos(angleRad), bottomY - featherLen * Math.sin(angleRad));
      ctx.moveTo(compEndX, bottomY);
      ctx.lineTo(compEndX + featherLen * Math.cos(angleRad), bottomY + featherLen * Math.sin(angleRad));
      ctx.stroke();
    }

    // 5. 終了前のアナウンス画面
    const end_screen = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="instruction-title">テストがおわりました！</div>
        <div class="end-text" style="text-align: center;">
          <p>がんばって答えてくれて、ありがとうございました。</p>
          <p>下のボタンを押すと、データを送信して実験を完了します。</p>
        </div>
      `,
      choices: ['データを保存して完了する']
    };
    timeline.push(end_screen);

    // 6. 最終結果の表示（「ご協力ありがとうございました」のみを表示）
    function showFinalResults(trials, csvData, statusMessage, errorMessage) {
      const target = document.getElementById('jspsych-target');
      
      // 実験結果データ表示を完全に排除し、画面中央に感謝のテキストのみを綺麗に配置
      target.innerHTML = `
        <div class="jspsych-content" style="max-width: 600px; text-align: center; padding: 48px 32px;">
          <div style="font-size: 3.5rem; margin-bottom: 24px;">🤝</div>
          <div class="instruction-title" style="font-size: 1.8rem; color: #111827; margin-bottom: 16px;">
            ご協力ありがとうございました
          </div>
          <p class="end-text" style="text-align: center; color: #4b5563; font-size: 1.1rem; margin-bottom: 0;">
            これで、すべての目の錯覚テストは終了です。<br>
            そのまま画面を閉じてください。
          </p>
        </div>
      `;
    }

    // 実験の実行
    jsPsych.run(timeline);
